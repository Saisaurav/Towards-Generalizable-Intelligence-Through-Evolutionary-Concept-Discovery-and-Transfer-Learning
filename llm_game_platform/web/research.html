<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Concept transfer – research view</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--fg:#1c1f24;--mut:#667;--line:#d9dde3;--acc:#2a6df4;--warn:#b45309;--c1:#2a6df4;--c2:#d9480f;--c3:#2b8a3e;--c4:#9c36b5;--c5:#868e96}
@media(prefers-color-scheme:dark){:root{--bg:#15171b;--fg:#e6e8eb;--mut:#9aa3ad;--line:#2c3138;--acc:#6ea0ff;--warn:#f0a35a;--c1:#6ea0ff;--c2:#ff8a5c;--c3:#69db7c;--c4:#da77f2;--c5:#adb5bd}}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}header{padding:14px 20px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}main{padding:16px 20px;max-width:1200px;margin:auto}nav button{border:1px solid var(--line);background:none;color:var(--fg);padding:6px 12px;border-radius:6px;cursor:pointer;margin-right:6px}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--warn);color:var(--warn);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:8px;padding:10px}.card h3{margin:0 0 4px;font-size:13px}
svg{width:100%;height:auto;display:block}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;font-size:13px}tr.row{cursor:pointer}tr.row:hover{background:rgba(120,140,170,.12)}
code{font:12px ui-monospace,monospace;word-break:break-all}.mut{color:var(--mut)}select{padding:4px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px}.legend span{margin-right:12px;font-size:12px}
.cell{display:inline-block;width:30px;height:30px;border:1px solid var(--line);text-align:center;line-height:30px;font-size:13px}
</style></head><body>
<header><h1>Cross-game concept transfer — research view <span class="badge" id="kind">cached experiment data</span></h1>
<div class="mut">All numbers are read from pre-computed result files (offline, no live LLM or training). Nothing on this page is generated live.</div></header>
<main><nav><button id="t0" class="on">Learning curves</button><button id="t1">Concept browser</button><button id="t2">Cached demo games</button></nav><div id="view" style="margin-top:14px"></div></main>
<script>
const $=s=>document.querySelector(s);let EX,CO,DG;const COL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
const f=(x,d=3)=>x==null?'–':(+x).toFixed(d);
async function load(){try{[EX,CO,DG]=await Promise.all(['experiments','concepts','demo_games'].map(n=>fetch('/data/'+n+'.json').then(r=>{if(!r.ok)throw 0;return r.json()})))}catch(e){$('#view').innerHTML='<p>Cached result files not found. Run <code>python3 experiments/build_frontend_data.py</code>.</p>';return}tab(0)}
function line(series,{xl='',yl='',w=520,h=220,xs}={}){const P=36,pts=series.flatMap(s=>s.pts.filter(p=>p[1]!=null));if(!pts.length)return'<div class="mut">no data</div>';
 const x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0]))||1,y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1])),yr=(y1-y0)||1;
 const X=v=>P+(v-x0)/((x1-x0)||1)*(w-P-8),Y=v=>h-24-(v-y0)/yr*(h-34);let o=`<svg viewBox="0 0 ${w} ${h}">`;
 for(let i=0;i<=4;i++){const v=y0+yr*i/4,y=Y(v);o+=`<line x1="${P}" x2="${w-8}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P-4}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--mut)">${f(v,Math.abs(yr)<5?2:0)}</text>`}
 o+=`<text x="${w/2}" y="${h-4}" font-size="10" text-anchor="middle" fill="var(--mut)">${xl}</text><text x="10" y="12" font-size="10" fill="var(--mut)">${yl}</text>`;
 series.forEach((s,i)=>{const c=s.color||COL[i%5];if(s.dots){s.pts.forEach(p=>o+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2" fill="${c}" opacity=".6"/>`)}else{const d=s.pts.filter(p=>p[1]!=null).map((p,j)=>(j?'L':'M')+X(p[0])+' '+Y(p[1])).join('');o+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${s.w||1.6}" ${s.dash?'stroke-dasharray="4 3"':''}/>`}});
 return o+'</svg>'+'<div class="legend">'+series.filter(s=>s.name).map((s,i)=>`<span style="color:${s.color||COL[i%5]}">●</span><span>${s.name}</span>`).join('')+'</div>'}
function tab(i){[0,1,2].forEach(k=>$('#t'+k).classList.toggle('on',k==i));[curves,concepts,demos][i]()}
for(let k=0;k<3;k++)$('#t'+k).onclick=()=>tab(k);
function curves(){const secs=[...new Set(EX.groups.map(g=>g.section))];$('#view').innerHTML=`<label>Section <select id="sec">${secs.map(s=>`<option>${s}</option>`).join('')}</select></label> <label>Game <select id="gm"></select></label> <label>Run group <select id="grp"></select></label><div id="body" style="margin-top:12px"></div>`;
 const fill=()=>{const sec=$('#sec').value;const games=[...new Set(EX.groups.filter(g=>g.section==sec).map(g=>g.game))];const cur=$('#gm').value;$('#gm').innerHTML=games.map(g=>`<option>${g}</option>`).join('');if(games.includes(cur))$('#gm').value=cur;fg()};
 const fg=()=>{const gs=EX.groups.filter(g=>g.section==$('#sec').value&&g.game==$('#gm').value);$('#grp').innerHTML=gs.map(g=>`<option value="${g.group}">${g.group}</option>`).join('');show()};
 const show=()=>{const g=EX.groups.find(g=>g.section==$('#sec').value&&g.group==$('#grp').value);if(!g)return;const c=g.curve_mean_over_seeds,d=g.detail_run.curve,gl=g.game=='cartpole';
  const sf=Object.values(g.seed_final).map(v=>f(v,gl?0:2)).join(', ');
  const ep=[{name:'best fitness (mean over seeds)',pts:c.map(p=>[p.train_steps,p.best]),w:1},{name:'best, smoothed',pts:c.map(p=>[p.train_steps,p.best_smoothed]),w:2.2},{name:'population mean fitness',pts:c.map(p=>[p.train_steps,p.pop_mean_smoothed]),w:1.6,dash:1},{name:'held-out greedy (100 eps, champion)',pts:c.map(p=>[p.train_steps,gl?p.heldout_len:p.heldout_greedy]),w:2,color:'var(--c3)'}];
  const ind=[{name:'individual genomes (seed '+g.detail_run.seed+')',pts:d.flatMap(p=>p.fitness.map(v=>[p.train_steps,v])),dots:1,color:'var(--c1)'},{name:'best',pts:d.map(p=>[p.train_steps,p.best]),color:'var(--c2)'}];
  $('#body').innerHTML=`<div class="card"><b>${g.group}</b> <span class="mut">${g.n_runs} seeds (${g.n_failed} failed) · ${g.metric}: <b>${f(g.final_mean,gl?1:3)} ± ${f(g.final_sd,gl?1:3)}</b> · stochastic ${f(g.stochastic_mean,gl?1:3)} · random policy ${f(g.random_baseline,gl?1:3)} · repo ${g.repo_version} · ${f(g.runtime_sec_mean,1)} s/run</span><div class="mut">per-seed held-out: ${sf}</div></div>
  <div class="grid" style="margin-top:10px"><div class="card"><h3>Episode reward vs PPO training steps (mean over seeds)</h3>${line(ep,{xl:'PPO rollout steps',yl:gl?'episode length':'episode return'})}</div>
  <div class="card"><h3>Individual genome performance (one seed)</h3>${line(ind,{xl:'PPO rollout steps',yl:'genome fitness'})}</div>
  <div class="card"><h3>Population diversity (mean pairwise genome distance) &amp; species</h3>${line([{name:'diversity',pts:c.map(p=>[p.train_steps,p.diversity])},{name:'species count (÷10)',pts:c.map(p=>[p.train_steps,p.species/10]),dash:1}],{xl:'PPO rollout steps'})}</div>
  <div class="card"><h3>Network architecture evolution (champion)</h3>${line([{name:'nodes',pts:c.map(p=>[p.train_steps,p.champ_nodes])},{name:'connections (÷10)',pts:c.map(p=>[p.train_steps,p.champ_conns/10]),dash:1},{name:'population avg nodes',pts:c.map(p=>[p.train_steps,p.avg_nodes]),w:1}],{xl:'PPO rollout steps'})}</div></div>
  <div class="card" style="margin-top:10px"><h3>Config</h3><code>${JSON.stringify(g.config)}</code><br><code>${JSON.stringify(g.resolved)}</code><br><span class="mut">champion architecture (mean): ${JSON.stringify(g.architecture_mean)}</span></div>`};
 $('#sec').onchange=fill;$('#gm').onchange=fg;$('#grp').onchange=show;fill()}
function concepts(){$('#view').innerHTML=`<p class="mut">${CO.note} Created ${CO.created_utc}.</p><table><thead><tr><th>ID</th><th>Formula</th><th>Source</th><th>Std (target)</th><th>Held-out |r|</th><th>Teacher</th><th>Admitted</th></tr></thead><tbody>${CO.concepts.map((c,i)=>`<tr class="row" data-i="${i}"><td>${c.id}</td><td><code>${c.formula}</code></td><td>${c.source_environment}</td><td>${f(c.target_output_std)}</td><td>${f(c.validation_performance.source_test_abs_corr)}</td><td>${c.teacher_policy||'–'}</td><td>${c.admitted_into_target?'yes':'no'}</td></tr>`).join('')}</tbody></table><div id="det" style="margin-top:14px"></div>`;
 document.querySelectorAll('tr.row').forEach(r=>r.onclick=()=>detail(CO.concepts[+r.dataset.i]))}
function detail(c){const gs=n=>EX.groups.find(g=>g.section==(c.curve_section||'transfer')&&g.group==n);const w=gs(c.with_concepts_group),wo=gs(c.without_concepts_group),rc=gs(c.random_control_group);const gl=w&&w.game=='cartpole';
 const S=(g,n)=>g?{name:n,pts:g.curve_mean_over_seeds.map(p=>[p.train_steps,gl?p.heldout_len:p.heldout_greedy])}:null;
 const tp=c.transfer_performance;
 $('#det').innerHTML=`<div class="card"><h3>${c.id}</h3><code>${c.formula}</code><table><tr><td>Source game</td><td>${c.source_environment}</td><td>Evaluated on</td><td>${c.evaluated_target_environment}</td></tr><tr><td>Primitive dependencies</td><td>${c.primitive_dependencies.join(', ')}</td><td>Complexity / depth</td><td>${c.complexity} / ${c.depth}</td></tr>
 <tr><td>Output std (target)</td><td>${f(c.target_output_std)}</td><td>Output std (grid probe)</td><td>${f(c.grid_probe_output_std)}</td></tr><tr><td>Discovery fitness (robust signed corr / consistency / novelty)</td><td>${f(c.discovery_fitness.source_robust_signed_corr)} / ${f(c.discovery_fitness.source_generalization_consistency)} / ${f(c.discovery_fitness.behavioral_novelty)}</td><td>Validation corr / held-out |r|</td><td>${f(c.validation_performance.source_validation_signed_corr)} / ${f(c.validation_performance.source_test_abs_corr)}</td></tr>
 <tr><td>Admitted into target?</td><td><b>${c.admitted_into_target?'yes':'no'}</b> — ${c.admission_reason}</td><td>Discovery seed</td><td>${c.discovery_seed}</td></tr></table>
 <p class="mut">Transfer (${tp.scope}): scratch ${f(tp.scratch_mean,3)} vs source concepts ${f(tp.source_concepts_mean,3)}; difference ${f(tp.mean_difference,3)} (95% CI ${f(tp.ci95[0],3)} to ${f(tp.ci95[1],3)}, permutation p=${f(tp.permutation_p)}, Holm p=${f(tp.holm_p)}, ${tp.n_seeds} seeds).</p>
 <h3>With vs without concepts (held-out greedy, mean over 10 seeds; pair-level)</h3>${line([S(wo,'without concepts (scratch)'),S(w,'with source concepts'),S(rc,'random-feature control')].filter(Boolean),{xl:'PPO rollout steps',yl:tp.target_metric.split('(')[0]})}</div>`}
function demos(){const rows=DG.map(d=>{const g=n=>EX.groups.find(x=>x.section=='demo'&&x.group==d.id+'_'+n);const cells=[];for(let y=0;y<d.height;y++){let r='';for(let x=0;x<d.width;x++){const k=(x==d.start[0]&&y==d.start[1])?'S':(x==d.goal[0]&&y==d.goal[1])?'G':d.walls.some(w=>w[0]==x&&w[1]==y)?'#':d.hazards.some(w=>w[0]==x&&w[1]==y)?'!':'';r+=`<span class="cell" style="background:${k=='#'?'#667':k=='!'?'#e8590c55':k=='G'?'#2b8a3e55':k=='S'?'#2a6df455':'transparent'}">${k}</span>`}cells.push(r+'<br>')}
 const rs=['without','with','random','sxa'].map(n=>g(n)).filter(Boolean);return`<div class="card"><h3>${d.title} <span class="badge">${d.source}</span></h3><div class="mut">${d.description}</div><div style="margin:8px 0;line-height:0">${cells.join('')}</div><table><tr><th>Condition (10 seeds)</th><th>Held-out return</th><th>Success runs</th></tr>${rs.map(x=>`<tr><td>${x.group.slice(d.id.length+1)}</td><td>${f(x.final_mean,2)} ± ${f(x.final_sd,2)}</td><td>${Object.values(x.seed_final).filter(v=>v>0).length}/${x.n_runs}</td></tr>`).join('')}</table></div>`}).join('');
 $('#view').innerHTML=`<p class="mut">Three pre-generated grid games (hand-authored specs in the platform schema, validated by GameSpec; <b>not</b> live LLM output). "without" = action_norm only; "with" = 8 bank concepts; "random" = 8 random features; "sxa" = raw state×action. With-concepts is NOT evidence of transfer unless it beats the controls.</p><div class="grid">${rows}</div>`}
load();
</script></body></html>
